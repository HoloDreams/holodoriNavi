<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>最終更新時刻</title>
</head>
<body>最終更新時刻取得中
  <script>
    const endpoint = 'https://api.github.com/repos/holodreams/holodoriNavi/commits?per_page=1';

    function formatJapanTime(dateText) {
      const parts = new Intl.DateTimeFormat('ja-JP', {
        timeZone: 'Asia/Tokyo',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        hourCycle: 'h23'
      }).formatToParts(new Date(dateText));
      const values = Object.fromEntries(parts.map(({ type, value }) => [type, value]));
      return `${values.year}/${values.month}/${values.day} ${values.hour}:${values.minute}`;
    }

    fetch(`${endpoint}&_=${Date.now()}`, {
      cache: 'no-store',
      headers: {
        Accept: 'application/vnd.github+json',
        'X-GitHub-Api-Version': '2022-11-28'
      }
    })
      .then((response) => {
        if (!response.ok) throw new Error(`GitHub API: ${response.status}`);
        return response.json();
      })
      .then(([latestCommit]) => {
        const updatedAt = latestCommit?.commit?.committer?.date
          || latestCommit?.commit?.author?.date;
        if (!updatedAt) throw new Error('更新時刻がありません');
        document.body.textContent = `最終更新時刻${formatJapanTime(updatedAt)}`;
      })
      .catch(() => {
        document.body.textContent = '最終更新時刻取得失敗';
      });
  </script>
</body>
</html>
