name: Update Instagram news
on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/news_img/update-instagram.mjs'
      - '.github/workflows/instagram-news.yml'
permissions:
  contents: write
concurrency:
  group: instagram-news-main
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.PAGES_PUBLISH_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch public Instagram posts
        run: node code/news_img/update-instagram.mjs
      - name: Commit updated feed
        run: |
          git add code/news_img/instagram-live.js
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update Instagram news'
          git push origin HEAD:main
