<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ページが見つかりません - ホロドリナビ</title>
  <link rel="icon" href="code/img/favicon.ico">
  <style>
    :root {
      --holodori-blue: #00a9ee;
      --holodori-sky: #b9edff;
      --holodori-text: #333333;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
      color: var(--holodori-text);
      background: #ffffff url("code/img/background.png") center / cover no-repeat fixed;
    }

    .not-found {
      width: min(900px, calc(100% - 40px));
      text-align: center;
    }

    h1 {
      margin: 0 0 26px;
      color: #008ed0;
      font-size: clamp(34px, 7vw, 72px);
      line-height: 1.25;
      letter-spacing: 0;
      font-weight: 900;
    }

    p {
      margin: 0 auto;
      max-width: 760px;
      font-size: clamp(16px, 2.4vw, 22px);
      line-height: 2;
      font-weight: 700;
    }

  </style>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-J2HKLB9SM4"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-J2HKLB9SM4');
  </script></head>
<body>
  <main class="not-found">
    <h1>404<br>ページが見つかりません</h1>
    <p>URLが変わったか、ページがまだ準備中の可能性があります。<br>トップページや一覧ページから探してみてください。</p>
  </main>
</body>
</html>
