<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ページが見つかりません - ホロドリナビ</title>
  <link rel="icon" href="code/img/favicon.ico">
  <style>
    :root {
      --holodori-blue: #00a9ee;
      --holodori-sky: #b9edff;
      --holodori-text: #333333;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
      color: var(--holodori-text);
      background: #ffffff url("code/img/background.png") center / cover no-repeat fixed;
    }

    .not-found {
      width: min(880px, calc(100% - 40px));
      padding: 64px 28px 58px;
      text-align: center;
      border: 2px solid rgba(64, 204, 245, 0.35);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.86);
      box-shadow: 0 24px 60px rgba(0, 169, 238, 0.18);
      backdrop-filter: blur(8px);
    }

    .logo {
      width: min(220px, 62vw);
      height: auto;
      margin-bottom: 26px;
    }

    .code {
      margin: 0;
      color: var(--holodori-blue);
      font-size: clamp(64px, 14vw, 132px);
      line-height: 0.9;
      font-weight: 900;
      letter-spacing: 0;
    }

    h1 {
      margin: 22px 0 16px;
      color: #008ed0;
      font-size: clamp(28px, 5vw, 46px);
      line-height: 1.35;
      letter-spacing: 0;
    }

    p {
      margin: 0 auto;
      max-width: 620px;
      font-size: clamp(16px, 2.4vw, 21px);
      line-height: 2;
      font-weight: 700;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 18px;
      margin-top: 36px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 220px;
      min-height: 60px;
      padding: 14px 28px;
      border-radius: 14px;
      color: #ffffff;
      background: linear-gradient(135deg, #35c9f5, #0098d8);
      box-shadow: 0 14px 28px rgba(0, 158, 222, 0.22);
      text-decoration: none;
      font-size: 18px;
      font-weight: 900;
      transition: transform 0.22s ease, box-shadow 0.22s ease;
    }

    .button:hover,
    .button:focus-visible {
      transform: translateY(-3px);
      box-shadow: 0 18px 34px rgba(0, 158, 222, 0.3);
    }

    .button.secondary {
      color: var(--holodori-blue);
      background: rgba(255, 255, 255, 0.92);
      border: 2px solid #39c9f5;
    }

    @media (max-width: 560px) {
      .not-found {
        padding: 44px 18px 42px;
        border-radius: 20px;
      }

      .actions {
        gap: 12px;
      }

      .button {
        width: 100%;
        min-width: 0;
      }
    }
  </style>
</head>
<body>
  <main class="not-found">
    <img class="logo" src="code/img/logo.webp" alt="ホロドリナビ">
    <p class="code">404</p>
    <h1>ページが見つかりません</h1>
    <p>URLが変わったか、ページがまだ準備中の可能性があります。<br>トップページや一覧ページから探してみてください。</p>
    <div class="actions">
      <a class="button" href="code/home.html">HOMEへ戻る</a>
      <a class="button secondary" href="code/song.html">収録楽曲一覧へ</a>
    </div>
  </main>
</body>
</html>
