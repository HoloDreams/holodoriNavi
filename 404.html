<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ページが見つかりません - ホロドリナビ</title>
  <link rel="icon" href="code/img/favicon.ico">
  <style>
    :root {
      --holodori-blue: #00a9ee;
      --holodori-sky: #b9edff;
      --holodori-text: #333333;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
      color: var(--holodori-text);
      background: #ffffff url("code/img/background.png") center / cover no-repeat fixed;
    }

    .not-found {
      width: min(900px, calc(100% - 40px));
      text-align: center;
    }

    h1 {
      margin: 0 0 26px;
      color: #008ed0;
      font-size: clamp(34px, 7vw, 72px);
      line-height: 1.25;
      letter-spacing: 0;
      font-weight: 900;
    }

    p {
      margin: 0 auto;
      max-width: 760px;
      font-size: clamp(16px, 2.4vw, 22px);
      line-height: 2;
      font-weight: 700;
    }

    .actions {
      display: flex;
      justify-content: center;
      margin-top: 38px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 220px;
      min-height: 60px;
      padding: 14px 28px;
      border-radius: 14px;
      color: #ffffff;
      background: linear-gradient(135deg, #35c9f5, #0098d8);
      box-shadow: 0 14px 28px rgba(0, 158, 222, 0.22);
      text-decoration: none;
      font-size: 18px;
      font-weight: 900;
      transition: transform 0.22s ease, box-shadow 0.22s ease;
    }

    .button:hover,
    .button:focus-visible {
      transform: translateY(-3px);
      box-shadow: 0 18px 34px rgba(0, 158, 222, 0.3);
    }

    @media (max-width: 560px) {
      .button {
        width: 100%;
        min-width: 0;
      }
    }
  </style>
</head>
<body>
  <main class="not-found">
    <h1>404<br>ページが見つかりません</h1>
    <p>URLが変わったか、ページがまだ準備中の可能性があります。<br>トップページや一覧ページから探してみてください。</p>
    <div class="actions">
      <a class="button" href="code/home.html">HOMEへ戻る</a>
    </div>
  </main>
</body>
</html>
