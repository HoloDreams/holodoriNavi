        <span style="--i: 6;">g</span>

  <main class="fade-in-up">
    <h1>キャラクターカード一覧</h1>


    <div class="card-search-toolbar">
      <div class="search-container">
        <input type="text" id="search-input" class="search-input" placeholder="カード名またはホロメンの名前で検索">
      </div>
      <button type="button" id="filter-toggle" class="filter-toggle" aria-expanded="false" aria-controls="card-filter-panel">
        <span class="filter-toggle-icon" aria-hidden="true"></span>
        <span>絞り込み</span>
        <span class="filter-toggle-arrow" aria-hidden="true">▼</span>
      </button>
    </div>

    <div id="card-filter-panel" class="card-filter-panel" aria-hidden="true">
      <div class="type-filter-container" aria-label="タイプで絞り込み">
        <button type="button" class="type-filter-btn active" data-type="all">すべて</button>
        <button type="button" class="type-filter-btn type-cute" data-type="cute">
          <img src="img/card-type/cute.svg" alt="" aria-hidden="true">キュート
        </button>
        <button type="button" class="type-filter-btn type-pure" data-type="pure">
          <img src="img/card-type/pure.svg" alt="" aria-hidden="true">ピュア
        </button>
        <button type="button" class="type-filter-btn type-happy" data-type="happy">
          <img src="img/card-type/happy.svg" alt="" aria-hidden="true">ハッピー
        </button>
      </div>
      <div class="type2-filter-container" aria-label="タイプ2で絞り込み">
        <button type="button" class="type2-filter-btn active" data-type2="all">すべて</button>
        <button type="button" class="type2-filter-btn type2-technique" data-type2="technique">
          <img src="img/card-type2/technique.svg" alt="" aria-hidden="true">テクニック
        </button>
        <button type="button" class="type2-filter-btn type2-performance" data-type2="performance">
          <img src="img/card-type2/performance.svg" alt="" aria-hidden="true">パフォーマンス
        </button>
        <button type="button" class="type2-filter-btn type2-sense" data-type2="sense">
          <img src="img/card-type2/sense.svg" alt="" aria-hidden="true">センス
        </button>
      </div>
      <div class="sort-container">
        <label for="sort-select">並び替え：</label>
        <select id="sort-select">
          <option value="default">新着順</option>
          <option value="debut-asc">デビュー順</option>
          <option value="rarity-desc">レアリティが高い順</option>
          <option value="rarity-asc">レアリティが低い順</option>
        </select>
      </div>
    </div>
<p id="page-info">
      全 <span id="total-count">0</span> 枚中、<span id="hit-count">0</span> 枚を表示
    </p>

    <div id="card-list-container" class="card-list"></div>

    <div class="pagination">
      <button id="prev-btn" class="page-btn">◀</button>
      <span id="current-page-num">1 / 1</span>
      <button id="next-btn" class="page-btn">▶</button>
    </div>
  </main>

  <div id="image-modal" class="modal-overlay">
    <div class="modal-content">
        <img id="modal-image" src="" alt="card">
        <div class="skill-wrapper">
          <p id="modal-name" class="modal-card-name"></p>
          <p id="modal-rarity"></p>
          <div id="modal-text-area" class="skill-container"></div>
        </div>
    </div>
  </div>

  <script src="js/card-data.js"></script>
  <script src="js/card-main.js"></script>

  <script>
    if (window.Lenis) {
      const lenis = new Lenis({
        duration: 1.2,
        easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
        smooth: true,
      });
      window.cardPageLenis = lenis;

      function raf(time) {
        lenis.raf(time);
        requestAnimationFrame(raf);
      }
      requestAnimationFrame(raf);
    }

    // 2. IntersectionObserver (フェードイン) の設定
    function revealAnimatedContent() {
      const targets = document.querySelectorAll('.fade-in-up');
      if (!targets.length) return;
      if ('IntersectionObserver' in window) {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('is-show');
              observer.unobserve(entry.target);
            }
          });
        }, {
          rootMargin: '0px 0px -33% 0px'
        });
        targets.forEach(el => observer.observe(el));
      } else {
        targets.forEach(el => el.classList.add('is-show'));
      }
    }
    document.addEventListener('DOMContentLoaded', revealAnimatedContent);

  </script>
  <script src="js/loading.js"></script>
  <script src="js/common_menu.js"></script>  <script src="js/site_notice.js"></script>
