<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>キャラクターカード情報</title>
  
  <script src="https://unpkg.com/@studio-freight/lenis@1.0.33/dist/lenis.min.js"></script>

  <link rel="stylesheet" href="css/base.css">
  <link rel="icon" href="img/favicon.ico">
  
  <link rel="stylesheet" href="css/loading.css">
  <link rel="stylesheet" href="css/common_menu.css">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-J2HKLB9SM4"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-J2HKLB9SM4');
  </script>  <link rel="stylesheet" href="css/site_notice.css">
  <link rel="stylesheet" href="css/character_card.css">
  <meta property="og:title" content="holodoriNavi">
  <meta property="og:description" content="ホロライブドリームスを更に知るならここ！">
  <meta property="og:image" content="https://holodreams.github.io/holodoriNavi/code/img/view.png">
  <meta property="og:url" content="https://holodreams.github.io/holodoriNavi/code/character_card.html">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="holodoriNavi">
  <meta name="twitter:description" content="ホロライブドリームスを更に知るならここ！">
  <meta name="twitter:image" content="https://holodreams.github.io/holodoriNavi/code/img/view.png">
</head>

<body>
  <div id="site-header" data-subtitle="カード情報一覧"></div>

  <main class="fade-in-up">
    <h1>キャラクターカード一覧</h1>


    <div class="card-search-toolbar">
      <div class="search-container">
        <input type="text" id="search-input" class="search-input" placeholder="カード名またはホロメンの名前で検索">
      </div>
      <button type="button" id="filter-toggle" class="filter-toggle" aria-expanded="false" aria-controls="card-filter-panel">
        <span class="filter-toggle-icon" aria-hidden="true"></span>
        <span>絞り込み</span>
        <span class="filter-toggle-arrow" aria-hidden="true">▼</span>
      </button>
    </div>

    <div id="card-filter-panel" class="card-filter-panel" aria-hidden="true">
      <div class="type-filter-container" aria-label="タイプで絞り込み">
        <button type="button" class="type-filter-btn active" data-type="all">すべて</button>
        <button type="button" class="type-filter-btn type-cute" data-type="cute">❤ キュート</button>
        <button type="button" class="type-filter-btn type-pure" data-type="pure">🍃 ピュア</button>
        <button type="button" class="type-filter-btn type-happy" data-type="happy">☀ ハッピー</button>
      </div>
      <div class="sort-container">
        <label for="sort-select">並び替え：</label>
        <select id="sort-select">
          <option value="default">新着順</option>
          <option value="debut-asc">デビュー順</option>
          <option value="rarity-desc">レアリティが高い順</option>
          <option value="rarity-asc">レアリティが低い順</option>
        </select>
      </div>
    </div>
<p id="page-info">
      全 <span id="total-count">0</span> 枚中、<span id="hit-count">0</span> 枚を表示
    </p>

    <div id="card-list-container" class="card-list"></div>

    <div class="pagination">
      <button id="prev-btn" class="page-btn">◀</button>
      <span id="current-page-num">1 / 1</span>
      <button id="next-btn" class="page-btn">▶</button>
    </div>
  </main>

  <div id="image-modal" class="modal-overlay">
    <div class="modal-content">
        <img id="modal-image" src="" alt="card">
        <div class="skill-wrapper">
          <p id="modal-name" class="modal-card-name"></p>
          <p id="modal-rarity"></p>
          <div id="modal-text-area" class="skill-container"></div>
        </div>
    </div>
  </div>

  <script src="js/card-data.js"></script>
  <script src="js/card-main.js"></script>

  <script src="js/loading.js"></script>
  <script src="js/common_menu.js"></script>
  <script src="js/site_notice.js"></script>
</body>
</html>
