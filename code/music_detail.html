<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>収録楽曲情報 - ホロドリナビ</title>
  <link rel="stylesheet" href="収録楽曲一覧/楽曲一覧.css">
  <link rel="stylesheet" href="css/loading.css">
  <link rel="stylesheet" href="css/common_menu.css">
  <link rel="stylesheet" href="css/site_notice.css">
  <link rel="icon" href="img/favicon.ico">
  <meta property="og:title" content="holodoriNavi">
  <meta property="og:description" content="ホロライブドリームスを更に知るならここ！">
  <meta property="og:image" content="https://holodreams.github.io/holodoriNavi/code/img/view.png">
  <meta property="og:url" content="https://holodreams.github.io/holodoriNavi/code/music_detail.html">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="holodoriNavi">
  <meta name="twitter:description" content="ホロライブドリームスを更に知るならここ！">
  <meta name="twitter:image" content="https://holodreams.github.io/holodoriNavi/code/img/view.png">
  <style>
    body { background: transparent; margin: 0; }
    .blurred-background {
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image: url('img/background.png');
      background-size: cover;
      background-position: center;
      filter: blur(20px) brightness(0.8);
      transform: scale(1.1);
    }
    .main-wrapper { position: relative; z-index: 10; }
    .detail-main.is-hidden,
    .song-not-found.is-hidden { display: none; }
    .song-not-found {
      min-height: 70vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 40px 20px;
      color: #333;
      font-weight: 800;
    }
    .song-not-found h1 {
      color: #008ed0;
      font-size: clamp(34px, 7vw, 68px);
      margin: 0 0 20px;
    }
    .song-not-found p {
      line-height: 2;
      font-size: clamp(15px, 2vw, 20px);
    }
    .display-title .title-link-icon { font-size: 0.65em; margin-left: 0.15em; }
    .video-grid:empty::before,
    .comment-box:empty::before {
      content: "未入力";
      color: #333;
      text-shadow: none;
      font-weight: 700;
    }
  </style>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-J2HKLB9SM4"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-J2HKLB9SM4');
  </script>
</head>
<body>
  <div class="holodori-loading-screen" role="status" aria-live="polite">
    <div class="holodori-loading-inner">
      <p class="holodori-loading-text" aria-label="Loading...">
        <span style="--i: 0;">L</span><span style="--i: 1;">o</span><span style="--i: 2;">a</span><span style="--i: 3;">d</span><span style="--i: 4;">i</span><span style="--i: 5;">n</span><span style="--i: 6;">g</span><span style="--i: 7;">.</span><span style="--i: 8;">.</span><span style="--i: 9;">.</span>
      </p>
      <div class="holodori-loading-bar" aria-hidden="true"><div class="holodori-loading-bar-fill"></div></div>
    </div>
  </div>

  <div class="blurred-background" id="blurredBackground"></div>
  <div class="main-wrapper">
    <a href="song.html" class="back-btn"><img src="img/back.png" alt="戻る"></a>
    <nav class="navbar">
      <div class="logo">
        <img src="img/ロゴ.png" alt="logo">
        <span class="site-title">ホロドリナビ<br>収録楽曲情報</span>
      </div>
      <ul class="nav-links">
        <li><a href="https://opening.hololive-dreams.com/" target="_blank">公式サイトはこちら</a></li>
        <li><a href="https://x.com/hololive_dreams" target="_blank">公式Xはこちら</a></li>
        <li><a href="https://www.youtube.com/@hololivedreams" target="_blank">公式YouTubeはこちら</a></li>
      </ul>
    </nav>

    <main class="detail-main" id="songDetailMain">
      <div class="song-detail-flex">
        <div class="side-jacket"><img id="songJacket" src="" alt=""></div>
        <div class="song-info-area">
          <h1 class="display-title" id="songTitle"></h1>
          <div class="bpm-area"><span class="bpm-label">BPM</span><span class="bpm-value" id="songBpm">?</span></div>
          <div class="song-stats-vertical" id="songStats"></div>
        </div>
      </div>

      <section class="chart-check-section" id="videoSection">
        <h2 class="section-title">譜面確認</h2>
        <div class="video-grid" id="videoGrid"></div>
      </section>

      <section class="chart-check-section">
        <h2 class="section-title">譜面について</h2>
        <div class="comment-box" id="songDescription"></div>
      </section>
    </main>

    <main class="song-not-found is-hidden" id="songNotFound">
      <div>
        <h1>404<br>ページが見つかりません</h1>
        <p>指定された楽曲情報はまだ準備中です。<br>楽曲一覧から別の曲を探してみてください。</p>
      </div>
    </main>
  </div>

  <script src="js/song-data.js"></script>
  <script src="js/song-detail.js"></script>
  <script src="js/loading.js"></script>
  <script src="js/common_menu.js"></script>
  <script src="js/site_notice.js"></script>
</body>
</html>
