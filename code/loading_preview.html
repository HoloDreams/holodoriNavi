<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading Preview - ホロドリナビ</title>
  <link rel="icon" href="img/favicon.ico">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #00aeff;
      color: #ffffff;
      font-family: "Arial", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    }

    .loading-screen {
      width: min(520px, calc(100vw - 48px));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      text-align: center;
    }

    .loading-text {
      display: flex;
      justify-content: center;
      gap: 2px;
      margin: 0;
      color: #ffffff;
      font-size: clamp(38px, 8vw, 82px);
      line-height: 1;
      font-weight: 900;
      letter-spacing: 0;
      text-shadow: 0 5px 0 rgba(0, 85, 140, 0.2);
    }

    .loading-text span {
      display: inline-block;
      animation: letterJump 5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      animation-delay: calc(var(--i) * 0.3s);
    }

    .loading-bar {
      width: min(420px, 82vw);
      height: 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.34);
      overflow: hidden;
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.35);
    }

    .loading-bar-fill {
      width: 42%;
      height: 100%;
      border-radius: inherit;
      background: #ffffff;
      animation: loadingGauge 1.6s ease-in-out infinite;
    }

    @keyframes letterJump {
      0%, 14%, 100% {
        transform: translateY(0);
      }
      5.4% {
        transform: translateY(-24px);
      }
      9% {
        transform: translateY(3px);
      }
      11.5% {
        transform: translateY(0);
      }
    }

    @keyframes loadingGauge {
      0% {
        transform: translateX(-110%);
      }
      55% {
        transform: translateX(75%);
      }
      100% {
        transform: translateX(250%);
      }
    }

    @media (max-width: 640px) {
      .loading-screen {
        gap: 22px;
      }

      .loading-bar {
        height: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="loading-screen" role="status" aria-live="polite">
    <p class="loading-text" aria-label="Loading...">
      <span style="--i: 0;">L</span>
      <span style="--i: 1;">o</span>
      <span style="--i: 2;">a</span>
      <span style="--i: 3;">d</span>
      <span style="--i: 4;">i</span>
      <span style="--i: 5;">n</span>
      <span style="--i: 6;">g</span>
      <span style="--i: 7;">.</span>
      <span style="--i: 8;">.</span>
      <span style="--i: 9;">.</span>
    </p>
    <div class="loading-bar" aria-hidden="true">
      <div class="loading-bar-fill"></div>
    </div>
  </div>
</body>
</html>
