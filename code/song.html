<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>収録楽曲情報</title>

  <script src="https://unpkg.com/@studio-freight/lenis@1.0.33/dist/lenis.min.js"></script>

  <link rel="stylesheet" href="css/base.css">
  <link rel="icon" href="img/favicon.ico">
  <link rel="stylesheet" href="css/loading.css">
  <link rel="stylesheet" href="css/common_menu.css">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-J2HKLB9SM4"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-J2HKLB9SM4');
  </script>
  <link rel="stylesheet" href="css/site_notice.css">
  <link rel="stylesheet" href="css/song.css">
  <meta property="og:title" content="holodoriNavi">
  <meta property="og:description" content="ホロライブドリームスを更に知るならここ！">
  <meta property="og:image" content="https://holodreams.github.io/holodoriNavi/code/img/view.png">
  <meta property="og:url" content="https://holodreams.github.io/holodoriNavi/code/song.html">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="holodoriNavi">
  <meta name="twitter:description" content="ホロライブドリームスを更に知るならここ！">
  <meta name="twitter:image" content="https://holodreams.github.io/holodoriNavi/code/img/view.png">
</head>

<body>
  <div id="site-header" data-subtitle="収録楽曲情報"></div>

  <main class="fade-in-up">
    <h1 style="text-align: center; margin-top: 50px;">収録楽曲一覧</h1>

    <div class="filter-wrapper">
      <div class="search-container">
        <input type="text" id="search-input" class="search-input" list="song-suggestions" placeholder="曲名またはホロメンの名前で検索">
        <datalist id="song-suggestions"></datalist>
      </div>

      <div class="level-filter-container">
        <label for="difficulty-select" class="filter-label">レベルで絞る：</label>
        <select id="difficulty-select">
          <option value="none" selected>指定なし</option>
          <option value="expert">EXPERT</option>
          <option value="hard">HARD</option>
          <option value="normal">NORMAL</option>
          <option value="easy">EASY</option>
        </select>
        <div class="range-inputs">
          <input type="number" id="level-min" min="1" max="35" placeholder="下限">
          <span class="range-separator">〜</span>
          <input type="number" id="level-max" min="1" max="35" placeholder="上限">
        </div>
      </div>

      <div class="sort-container">
        <label for="sort-select" class="filter-label">並び順：</label>
        <select id="sort-select">
          <option value="default" selected>デフォルト順</option>
          <option value="release-desc">配信順</option>
          <option value="bpm-desc">BPM高い順</option>
          <option value="bpm-asc">BPM低い順</option>
          <option value="combo-desc">コンボ数多い順</option>
          <option value="combo-asc">コンボ数少ない順</option>
          <option value="constant-desc">譜面定数</option>
          <option value="level-desc">レベル高い順</option>
          <option value="level-asc">レベル低い順</option>
          <option value="title-ja">50音順</option>
        </select>
      </div>

    </div>

    <p id="page-info">
      全 <span id="total-count">0</span> 曲中、<span id="hit-count">0</span> 曲を表示
    </p>

    <div id="song-list-container" class="song-list"></div>

    <div class="pagination">
      <button id="prev-btn" class="page-btn">◀</button>
      <span id="current-page-num">1 / 1</span>
      <button id="next-btn" class="page-btn">▶</button>
    </div>
  </main>

  <script src="js/song-data.js"></script>
  <script src="js/song-main.js"></script>

  <script src="js/loading.js"></script>
  <script src="js/common_menu.js"></script>
  <script src="js/site_notice.js"></script>

</body>

</html>
