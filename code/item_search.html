<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アイテム一覧</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="icon" href="img/favicon.ico">
  <script src="https://unpkg.com/@studio-freight/lenis@1.0.33/dist/lenis.min.js"></script>
  <link rel="stylesheet" href="css/loading.css">
  <link rel="stylesheet" href="css/common_menu.css">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-J2HKLB9SM4"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-J2HKLB9SM4');
  </script>  <link rel="stylesheet" href="css/site_notice.css">
  <link rel="stylesheet" href="css/item_search.css">
  <meta property="og:title" content="holodoriNavi">
  <meta property="og:description" content="ホロライブドリームスを更に知るならここ！">
  <meta property="og:image" content="https://holodreams.github.io/holodoriNavi/code/img/view.png">
  <meta property="og:url" content="https://holodreams.github.io/holodoriNavi/code/item_search.html">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="holodoriNavi">
  <meta name="twitter:description" content="ホロライブドリームスを更に知るならここ！">
  <meta name="twitter:image" content="https://holodreams.github.io/holodoriNavi/code/img/view.png">
</head>
<body>
  <div id="site-header" data-subtitle="アイテム一覧"></div>

  <main class="fade-in-up">
    <h1>アイテム一覧</h1>

    <section class="item-intro">
      <p>ゲーム内アイテムを画像付きで探せる一覧ページです。</p>
    </section>

    <div class="filter-wrapper">
      <div class="search-container">
        <input type="text" id="item-search-input" class="search-input" placeholder="アイテム名または説明で検索">
      </div>
    </div>

    <p id="item-page-info" class="item-page-info">
      全 <span id="total-count">0</span> 件中、<span id="hit-count">0</span> 件を表示
    </p>

    <div id="item-list-container" class="item-list"></div>

    <div class="pagination">
      <button id="prev-btn" class="page-btn" type="button">◀</button>
      <span id="current-page-num">1 / 1</span>
      <button id="next-btn" class="page-btn" type="button">▶</button>
    </div>
  </main>

  <div id="item-modal" class="item-modal" aria-hidden="true">
    <div class="item-modal-panel" role="dialog" aria-modal="true" aria-labelledby="item-modal-title">
      <button type="button" id="item-modal-close" class="item-modal-close" aria-label="閉じる">×</button>
      <img id="item-modal-image" src="" alt="">
      <div class="item-modal-text">
        <h2 id="item-modal-title"></h2>
        <p id="item-modal-description"></p>
        <div id="item-modal-get" class="item-modal-get" hidden></div>
      </div>
    </div>
  </div>

  <script src="js/item-data.js"></script>
  <script src="js/item-search.js"></script>
  <script src="js/loading.js"></script>
  <script src="js/common_menu.js"></script>
  <script src="js/site_notice.js"></script>
</body>
</html>
