  <main class="dan-main" id="content-root">
    <h1 class="page-title">非公式段位</h1>
    <p class="dan-intro-text">ホロリスが作成した非公式段位表です。曲名を押すと、対応する楽曲情報ページへ移動できます。<br>ぜひチャレンジしてみてください！</p>
    <div id="dan-dataset-switcher" class="dan-dataset-switcher" aria-label="段位表の切り替え">
      <button id="dan-dataset-prev" class="dan-dataset-button" type="button" aria-label="前の段位表">◀</button>
      <span id="dan-dataset-title" class="dan-dataset-title">段位表</span>
      <button id="dan-dataset-next" class="dan-dataset-button" type="button" aria-label="次の段位表">▶</button>
    </div>
    <section id="dan-rank-list" class="dan-rank-list" aria-label="段位一覧"></section>
    <p id="dan-credit" class="dan-credit" hidden></p>
  </main>

  <script src="https://unpkg.com/@studio-freight/lenis@1.0.33/dist/lenis.min.js"></script>
  <script>
    if (window.Lenis) {
      const lenis = new Lenis({ duration: 1.2, easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)), smooth: true });
      function raf(time) { lenis.raf(time); requestAnimationFrame(raf); }
      requestAnimationFrame(raf);
    }
  </script>
